<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradClinic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#0f1b36"/>
      <stop offset="100%" stop-color="#050a17"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="gridClinic" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d4a" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradClinic)"/>
  <rect width="1200" height="675" fill="url(#gridClinic)"/>

  <!-- Ambient Glow -->
  <circle cx="250" cy="180" r="280" fill="#00f2fe" opacity="0.07" filter="blur(40px)"/>
  <circle cx="950" cy="480" r="260" fill="#0072ff" opacity="0.08" filter="blur(50px)"/>

  <!-- Main Card Container -->
  <rect x="100" y="90" width="1000" height="495" rx="16" fill="#0c162c" fill-opacity="0.75" stroke="#1e3256" stroke-width="2"/>
  
  <!-- Header Badge -->
  <rect x="140" y="130" width="260" height="36" rx="18" fill="url(#tealGlow)" opacity="0.2"/>
  <text x="270" y="153" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">DENTAL CRM &amp; AI PLATFORM</text>

  <!-- Main Title -->
  <text x="140" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">🦷 CLINIC MVP</text>
  <text x="140" y="285" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">Dental CRM, Telegram Automation &amp; AI X-Ray Watchdog (ShadowAnalyst)</text>

  <!-- Tech Stack Badges Container -->
  <g transform="translate(140, 340)">
    <rect x="0" y="0" width="130" height="42" rx="8" fill="#172642" stroke="#253a60" stroke-width="1"/>
    <text x="65" y="26" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python 3.10+</text>

    <rect x="145" y="0" width="120" height="42" rx="8" fill="#172642" stroke="#253a60" stroke-width="1"/>
    <text x="205" y="26" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">aiogram 3</text>

    <rect x="280" y="0" width="120" height="42" rx="8" fill="#172642" stroke="#253a60" stroke-width="1"/>
    <text x="340" y="26" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">FastAPI</text>

    <rect x="415" y="0" width="120" height="42" rx="8" fill="#172642" stroke="#253a60" stroke-width="1"/>
    <text x="475" y="26" fill="#61dafb" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">React 18</text>

    <rect x="550" y="0" width="140" height="42" rx="8" fill="#172642" stroke="#253a60" stroke-width="1"/>
    <text x="620" y="26" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">PostgreSQL</text>

    <rect x="705" y="0" width="150" height="42" rx="8" fill="#172642" stroke="#253a60" stroke-width="1"/>
    <text x="780" y="26" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">ShadowAnalyst</text>
  </g>

  <!-- Visual Feature Highlights -->
  <g transform="translate(140, 420)">
    <text x="0" y="25" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="500">Modules: Dental MIS • Telegram Bot • OpenCV &amp; Multimodal AI Diagnostics • LAN MQTT Sync</text>
  </g>

  <!-- Accent Divider -->
  <rect x="140" y="480" width="920" height="4" rx="2" fill="url(#tealGlow)"/>
</svg>
